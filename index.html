<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Безумие: Игра</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #1a1a1a; color: #eee; display: flex; flex-direction: column; min-height: 100vh; }
        .main-title { font-family: 'Cinzel', serif; text-align: center; font-size: 24px; color: #e74c3c; text-shadow: 0 0 10px rgba(231, 76, 60, 0.5); padding: 15px 10px; background: #111; margin: 0; border-bottom: 2px solid #333; letter-spacing: 2px; }
        .content-wrapper { flex: 1; padding: 10px; }
        
        .game-stats { display: flex; justify-content: space-around; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; flex-wrap: wrap; gap: 10px; }
        .game-stat { display: flex; flex-direction: column; align-items: center; }
        .game-stat span:first-child { color: #aaa; font-size: 11px; text-transform: uppercase; }
        .game-stat span:last-child { color: #f39c12; font-weight: bold; font-size: 16px; }
        
        .floor-selector { display: flex; gap: 5px; overflow-x: auto; margin-bottom: 15px; padding-bottom: 5px; }
        .floor-btn { padding: 8px 15px; background: #333; border: 1px solid #555; color: #fff; border-radius: 4px; cursor: pointer; white-space: nowrap; font-size: 13px; }
        .floor-btn.active { background: #e74c3c; border-color: #e74c3c; }

        .boss-select { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .boss-btn { flex: 1; padding: 10px; background: #333; border: 2px solid #555; color: #fff; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; font-size: 12px;}
        .boss-btn.active { border-color: #e74c3c; background: #4a1a1a; }
        
        .battle-area { background: rgba(42, 42, 42, 0.8); padding: 15px; border-radius: 8px; margin-bottom: 15px; text-align: center; }
        .battle-hp-bar { width: 100%; height: 20px; background: #333; border-radius: 10px; overflow: hidden; margin: 10px 0; }
        .battle-hp-fill { height: 100%; background: #e74c3c; transition: width 0.3s; }
        .battle-log { max-height: 150px; overflow-y: auto; font-size: 13px; color: #ccc; text-align: left; margin-top: 10px; border-top: 1px solid #444; padding-top: 10px; }
        
        .btn { width: 100%; padding: 12px; background: #e74c3c; color: #fff; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        .btn:disabled { background: #555; cursor: not-allowed; }

        .inventory { background: rgba(42, 42, 42, 0.8); padding: 15px; border-radius: 8px; margin-top: 15px; }
        .inv-item { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #333; font-size: 14px; cursor: pointer; }
        .inv-item:hover { background: #333; }
        
        .equipment { background: rgba(42, 42, 42, 0.8); padding: 15px; border-radius: 8px; margin-top: 15px; }
        .eq-slot { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #333; font-size: 14px; }
        .eq-slot span:last-child { color: #2ecc71; }
    </style>
</head>
<body>

<h1 class="main-title">ИГРА БЕЗУМИЕ</h1>

<div class="content-wrapper">

    { name: "Самсон", floor: "H-2", hp: 2000000, dmg: [450, 1300], xp: 861, gold: 408, pills: 0, drop: ["Кисть"] },
    { name: "Безликая", floor: "H-3", hp: 2000000, dmg: [450, 1350], xp: 864, gold: 409, pills: 0, drop: ["Лезвия"] },

    { name: "Толстяк", floor: "I-1", hp: 5000000, dmg: [1350, 4100], xp: 1150, gold: 1455, pills: 0, drop: ["Железка"] },
    { name: "Уборщик", floor: "I-1", hp: 5000000, dmg: [1200, 3700], xp: 1200, gold: 1480, pills: 0, drop: ["Штырь"] },
    { name: "Весельчаки", floor: "I-2", hp: 6500000, dmg: [1380, 4140], xp: 1400, gold: 1600, pills: 0, drop: ["Маска"] },
    { name: "Глаз", floor: "I-2", hp: 6000000, dmg: [1550, 4650], xp: 1375, gold: 1560, pills: 0, drop: ["Ядовитое щупальце"] },
    { name: "Гамбит", floor: "I-3", hp: 6000000, dmg: [1140, 3430], xp: 1550, gold: 1700, pills: 0, drop: ["Рог"] },

// --- СЕТЫ ЭКИПИРОВКИ ---
const EQUIPMENT_SETS = {
    "patient_set": {
        name: "Набор пациента",
        items: ["patient_pants", "patient_jacket", "patient_gloves", "patient_boots", "patient_mask", "patient_hat", "patient_weapon"],
        stat_bonus: { madness: 1, aggression: 1, fury: 1 }
    },
    "madman_set": {
        name: "Безумец",
        items: ["madman_pants", "madman_jacket", "madman_gloves", "madman_boots", "madman_mask", "madman_hat", "madman_amulet", "madman_weapon", "madman_pet"],
        stat_bonus: { madness: 1, aggression: 1, fury: 1 }
    }
};

// --- СОСТОЯНИЕ ИГРОКА ---
let g_player = JSON.parse(localStorage.getItem('madness_player_v5')) || {
    level: 1,
    xp: 0,
    max_hp: 190,
    hp: 190,
    base_dmg: 40,
    energy: 100,
    max_energy: 100,
    gold: 50000,
    pills: 5000,
    bills: 100,
    stats: { madness: 30, aggression: 30, fury: 30 },
    currentFloor: "A",
    currentBoss: null,
    bossCurrentHp: 0,
    battleLog: [],
    inventory: {},
    equipment: {
        weapon: "patient_weapon", pants: "patient_pants", jacket: "patient_jacket",
        gloves: "patient_gloves", boots: "patient_boots", mask: "patient_mask", hat: "patient_hat"
    } // Стартовый сет
};

function g_savePlayer() {
    localStorage.setItem('madness_player_v5', JSON.stringify(g_player));
}

// --- ПЕРЕСЧЕТ СТАТОВ С УЧЕТОМ ЭКИПИРОВКИ ---
function recalcStats() {
    // Базовые статы
    let base = { madness: 30, aggression: 30, fury: 30 };
    
    // Бонусы от экипировки
    Object.values(g_player.equipment).forEach(itemId => {
        if (!itemId) return;
        // Ищем, к какому сету относится предмет
        for (const [setName, setData] of Object.entries(EQUIPMENT_SETS)) {
            if (setData.items.includes(itemId)) {
                base.madness += setData.stat_bonus.madness;
                base.aggression += setData.stat_bonus.aggression;
                base.fury += setData.stat_bonus.fury;
                break;
            }
        }
    });

    g_player.stats = base;
    g_player.max_hp = 100 + (g_player.stats.madness * 3);
    g_player.base_dmg = 10 + (g_player.stats.aggression * 3);
    
    if (g_player.hp > g_player.max_hp) g_player.hp = g_player.max_hp;
}

// --- РЕНДЕР ---
function renderGame() {
    const container = document.getElementById("gameContainer");
    if (!container) return;

    recalcStats();

    const floors = [...new Set(GAME_BOSSES.map(b => b.floor.split('-')[0]))].sort();
    let floorHtml = "";
    floors.forEach(f => {
        floorHtml += `<button class="floor-btn ${g_player.currentFloor === f ? 'active' : ''}" onclick="selectFloor('${f}')">Этаж ${f}</button>`;
    });

    const floorBosses = GAME_BOSSES.filter(b => b.floor.startsWith(g_player.currentFloor));
    let bossHtml = "";
    floorBosses.forEach(b => {
        const isActive = g_player.currentBoss === b.name;
        bossHtml += `<button class="boss-btn ${isActive ? 'active' : ''}" onclick="selectBoss('${b.name}')">${b.name}</button>`;
    });

    let currentBossData = GAME_BOSSES.find(b => b.name === g_player.currentBoss);
    let battleHtml = "";
    
    if (currentBossData) {
        let hpPercent = (g_player.bossCurrentHp / currentBossData.hp) * 100;
        battleHtml = `
            <div class="battle-area">
                <h3>${currentBossData.name}</h3>
                <div class="battle-hp-bar"><div class="battle-hp-fill" style="width: ${hpPercent}%; background: ${hpPercent < 30 ? '#e74c3c' : '#2ecc71'};"></div></div>
                <p class="small">HP: ${Math.max(0, g_player.bossCurrentHp)} / ${currentBossData.hp}</p>
                
                <div style="display: flex; gap: 10px; justify-content: center; margin-top: 10px;">
                    <button class="btn" onclick="attackBoss()" style="flex: 1;">⚔️ Атаковать</button>
                    <button class="btn" onclick="resetBoss()" style="background: #555; flex: 1;">🔄 Сброс</button>
                </div>
                <div class="battle-log" id="battleLog">${g_player.battleLog.join('<br>')}</div>
            </div>
        `;
    } else {
        battleHtml = `<div class="battle-area"><p style="color:#aaa;">Выбери босса для боя</p></div>`;
    }

    // Инвентарь (Итемы)
    let invHtml = "";
    const items = Object.entries(g_player.inventory).filter(([k, v]) => v > 0);
    if (items.length > 0) {
        invHtml = `<div class="inventory"><h3 style="color: #f39c12; margin-top: 0;">🎒 Инвентарь</h3>`;
        items.forEach(([item, count]) => {
            invHtml += `<div class="inv-item" onclick="tryEquip('${item}')"><span>${item}</span><span>x${count}</span></div>`;
        });
        invHtml += `<p class="small" style="text-align:center; margin-top:10px;">Нажми на предмет, чтобы надеть</p></div>`;
    }

    // Экипировка
    let eqHtml = `<div class="equipment"><h3 style="color: #f39c12; margin-top: 0;">🛡️ Экипировка</h3>`;
    Object.entries(g_player.equipment).forEach(([slot, item]) => {
        if (item) {
            eqHtml += `<div class="eq-slot"><span>${slot}:</span><span>${item}</span></div>`;
        }
    });
    eqHtml += `</div>`;

    container.innerHTML = `
        <div class="game-stats">
            <div class="game-stat"><span>Ур.</span><span>${g_player.level}</span></div>
            <div class="game-stat"><span>❤️ HP</span><span>${Math.floor(g_player.hp)}/${g_player.max_hp}</span></div>
            <div class="game-stat"><span>⚔️ Урон</span><span>${g_player.base_dmg}</span></div>
            <div class="game-stat"><span>🧠 Безумие</span><span>${g_player.stats.madness}</span></div>
            <div class="game-stat"><span>😡 Агрессия</span><span>${g_player.stats.aggression}</span></div>
        </div>

        <h3 style="color: #f39c12; margin-bottom: 10px;">Выбор этажа</h3>
        <div class="floor-selector">${floorHtml}</div>

        <h3 style="color: #f39c12; margin-bottom: 10px;">Выбор босса</h3>
        <div class="boss-select">${bossHtml}</div>

        ${battleHtml}
        ${invHtml}
        ${eqHtml}
    `;
}

function selectFloor(f) {
    g_player.currentFloor = f;
    g_player.currentBoss = null;
    g_player.battleLog = [];
    g_savePlayer();
    renderGame();
}

function selectBoss(bossName) {
    g_player.currentBoss = bossName;
    const boss = GAME_BOSSES.find(b => b.name === bossName);
    g_player.bossCurrentHp = boss.hp;
    g_player.battleLog = [`Вы выбрали ${bossName}`];
    g_savePlayer();
    renderGame();
}

function resetBoss() {
    if (!g_player.currentBoss) return;
    const boss = GAME_BOSSES.find(b => b.name === g_player.currentBoss);
    g_player.bossCurrentHp = boss.hp;
    g_player.battleLog = [`Бой с ${boss.name} начат заново`];
    g_savePlayer();
    renderGame();
}

function attackBoss() {
    if (!g_player.currentBoss) return;
    const boss = GAME_BOSSES.find(b => b.name === g_player.currentBoss);
    
    let dmg = g_player.base_dmg + Math.floor(Math.random() * 10);
    g_player.battleLog.push(`Вы нанесли ${dmg} урона!`);
    g_player.bossCurrentHp -= dmg;

    if (g_player.bossCurrentHp <= 0) {
        g_player.battleLog.push(`🎉 Вы победили ${boss.name}!`);
        g_player.gold += boss.gold;
        g_player.pills += boss.pills;
        g_player.xp += boss.xp;
        g_player.bossCurrentHp = 0;
        g_player.hp = g_player.max_hp;

        if (boss.drop) {
            boss.drop.forEach(item => {
                if (item === "Комната") return;
                g_player.inventory[item] = (g_player.inventory[item] || 0) + 1;
                g_player.battleLog.push(`📦 Выпал предмет: ${item}`);
            });
        }

        if (g_player.xp >= 100) {
            g_player.xp -= 100;
            g_player.level++;
            g_player.max_hp += 10;
            g_player.hp = g_player.max_hp;
            g_player.battleLog.push(`⭐ УРОВЕНЬ ПОВЫШЕН до ${g_player.level}!`);
        }

        g_player.currentBoss = null;
        g_savePlayer();
        renderGame();
        return;
    }

    let bossDmg = boss.dmg[0] + Math.floor(Math.random() * (boss.dmg[1] - boss.dmg[0]));
    g_player.hp -= bossDmg;
    g_player.battleLog.push(`${boss.name} нанес ${bossDmg} урона!`);

    if (g_player.hp <= 0) {
        g_player.hp = 1;
        g_player.battleLog.push(`Вы проиграли! Восстановите HP.`);
        g_player.currentBoss = null;
    }

    if (g_player.battleLog.length > 10) g_player.battleLog.shift();

    g_savePlayer();
    renderGame();
}

// --- НАДЕВАНИЕ ПРЕДМЕТА ---
function tryEquip(itemName) {
    // Ищем, к какому слоту относится предмет (по названию)
    let slot = null;
    if (itemName.includes("Штаны")) slot = "pants";
    else if (itemName.includes("Куртка")) slot = "jacket";
    else if (itemName.includes("Перчатки")) slot = "gloves";
    else if (itemName.includes("Обувь")) slot = "boots";
    else if (itemName.includes("Маска")) slot = "mask";
    else if (itemName.includes("Головной убор")) slot = "hat";
    else if (itemName.includes("Оружие")) slot = "weapon";
    else if (itemName.includes("Аксессуар")) slot = "amulet";
    else if (itemName.includes("Питомец")) slot = "pet";
    else {
        alert("Этот предмет нельзя надеть (это не экипировка).");
        return;
    }

    // Проверяем, есть ли предмет в инвентаре
    if (!g_player.inventory[itemName] || g_player.inventory[itemName] <= 0) return;

    // Снимаем старое (если было)
    // (Упрощенно: просто заменяем)
    g_player.inventory[itemName]--;
    if (g_player.inventory[itemName] <= 0) delete g_player.inventory[itemName];

    g_player.equipment[slot] = itemName;
    g_savePlayer();
    renderGame();
}

renderGame();
</script>
